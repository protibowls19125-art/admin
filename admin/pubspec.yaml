name: mpro_dining_admin
description: "M·PROTI Dining Admin — Supabase Authentication"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

  # Supabase backend
  supabase_flutter: ^2.5.0

  # Navigation
  go_router: ^14.2.0

  # State management
  provider: ^6.1.2


  # Fonts
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.2.2

  # Images
  cached_network_image: ^3.3.1

  # Image picker for menu item photos
  image_picker: ^1.1.2

  # Charts for analytics
  fl_chart: ^0.69.0

  # Date/time formatting
  intl: ^0.20.2

  # File path utilities
  path: ^1.9.0

  # Open Google Maps links on mobile/desktop
  url_launcher: ^6.3.0

  # Icons
  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1

  # Push notifications (new-order alerts that fire even with the tab closed)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  qr_flutter: ^4.1.0

  # Native Android local notifications (used instead of FCM on Android APK)
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/sounds/new-order.mp3
